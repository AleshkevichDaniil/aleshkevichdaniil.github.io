<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval — Таймер</title>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/screens.css">
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body class="screen-page" data-screen="timer">

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7.5" y="5.5" width="3.4" height="13" rx="1.3" fill="currentColor" stroke="none"/><rect x="13.1" y="5.5" width="3.4" height="13" rx="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5.5v13l9.5-6.5z" fill="currentColor" stroke="none"/><path d="M18 6v12"/></symbol>

  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.9"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.6 9.9V19h10.8V9.9"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.4 3 6 13.4h4.9L10.3 21 18 10.6h-5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.4 4.6 4.6L19 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.4" width="14" height="9.6" rx="2.4"/><path d="M8.4 10.4V8a3.6 3.6 0 0 1 7.2 0v2.4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h8.4M17.4 8H20M4 16h2.6M11.6 16H20"/><circle cx="15" cy="8" r="2.1"/><circle cx="9" cy="16" r="2.1"/></symbol>

</svg>

<div class="page">
  <div class="stage">
    <div class="app-shell">
      <div class="app" data-view="timer">

        <header class="app-bar timer-bar">
          <a class="icon-btn" id="pauseTop" href="pause.html" aria-label="Пауза"><svg class="icon"><use href="#i-pause"/></svg></a>
          <div class="timer-title">
            <strong id="timerName" role="heading" aria-level="1" data-od-id="timer-title">Табата 20/10</strong>
            <span id="timerMeta">8 раундов · 4:00</span>
          </div>
          <span class="timer-spacer" aria-hidden="true"></span>
        </header>

        <main class="content timer-content">
          <div class="timer-dial" data-od-id="timer-dial">
            <svg viewBox="0 0 300 300" aria-hidden="true">
              <circle class="ring-track" cx="150" cy="150" r="142"/>
              <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="142" stroke-dasharray="892.2" stroke-dashoffset="0"/>
            </svg>
            <div class="dial-inner">
              <span class="phase-label" id="phaseLabel">Подготовка</span>
              <span class="dial-time num" id="dialTime">00:10</span>
              <span class="dial-sub" id="dialSub">старт через</span>
            </div>
          </div>

          <div class="round-track" id="roundTrack" aria-label="Прогресс раундов">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>

          <div class="next-up">
            <span>Далее</span>
            <strong id="nextPhase">Работа · 20 с</strong>
          </div>

          <div class="timer-controls">
            <button class="ctrl" id="skipBtn"><svg class="icon"><use href="#i-skip"/></svg>Пропустить</button>
            <a class="ctrl ctrl--primary" id="pauseBtn" href="pause.html" data-od-id="timer-pause" aria-label="Пауза"><svg class="icon"><use href="#i-pause"/></svg></a>
            <a class="ctrl" id="finishBtn" href="results.html"><svg class="icon"><use href="#i-stop"/></svg>Завершить</a>
          </div>
        </main>

      </div>
    </div>
  </div>

  <p class="page-note"><a href="onboarding.html">← Все экраны</a><span class="page-note__sep">·</span><span>04 · Таймер</span></p>
</div>

<script src="../assets/app.js"></script>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
