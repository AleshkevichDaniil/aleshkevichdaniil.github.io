<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Прототип</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .back {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(20, 22, 32, 0.82);
      color: #fff;
      font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }
    .back:hover { background: rgba(35, 38, 55, 0.92); }
  </style>
</head>
<body>
  <a class="back" id="back" href="/">← Назад</a>
  <iframe id="frame" title="Прототип"></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var src = params.get('src') || 'index.html';
      var back = params.get('back') || '/';
      document.getElementById('back').href = back;
      document.getElementById('frame').src = src;
    })();
  </script>
</body>
</html>
