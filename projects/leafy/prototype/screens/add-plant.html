<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leafy — Добавление растения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#3F7D4E;--on-primary:#FFFFFF;--primary-container:#D7E8D8;--on-primary-container:#1F4F2C;
    --bg:#F7F5EF;--surface:#FFFDF8;--surface-container:#F1EEE6;--surface-container-high:#EBE7DD;
    --on-surface:#1D211C;--on-surface-variant:#5E665C;--outline:#C8CFC2;--outline-variant:#DDE3D7;
    --r-md:20px;--r-lg:24px;--r-xl:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;}
  body{background:#DCDAD2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--on-surface);}
  .phone{width:412px;height:915px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(29,33,28,.22);display:flex;flex-direction:column;}
  .status{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:500;color:var(--on-surface-variant);}
  .topbar{padding:10px 12px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .back{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--on-surface);flex-shrink:0;}
  .back:hover{background:rgba(29,33,28,.08);}
  .topbar h1{font-size:22px;font-weight:500;letter-spacing:-.01em;}
  .content{flex:1;overflow-y:auto;padding:4px 20px 120px;}
  .content::-webkit-scrollbar{width:0;}
  .field{margin-bottom:18px;}
  label{display:block;font-size:14px;font-weight:500;color:var(--on-surface-variant);margin-bottom:8px;}
  input[type=text],select{width:100%;height:52px;border-radius:16px;border:1px solid var(--outline);background:var(--surface);padding:0 16px;font-size:16px;font-family:inherit;color:var(--on-surface);outline:none;appearance:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235E665C'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;background-size:20px;padding-right:44px;}
  input[type=text]:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(63,125,78,.16);}
  .search-wrap{position:relative;}
  .suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;overflow:hidden;display:none;box-shadow:0 10px 24px rgba(29,33,28,.12);}
  .suggest.show{display:block;}
  .suggest button{width:100%;text-align:left;padding:14px 16px;border:none;background:transparent;font-size:15px;font-family:inherit;color:var(--on-surface);cursor:pointer;border-bottom:1px solid var(--outline-variant);}
  .suggest button:last-child{border-bottom:none;}
  .suggest button:hover{background:var(--surface-container);}
  .row{display:flex;gap:12px;}
  .row .field{flex:1;min-width:0;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface-container);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px;}
  .toggle-row .text{font-size:16px;font-weight:500;}
  .toggle-row .sub{font-size:13px;color:var(--on-surface-variant);margin-top:2px;line-height:1.4;}
  .switch{position:relative;width:52px;height:32px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#C8CFC2;border-radius:16px;transition:background .2s;}
  .slider:before{position:absolute;content:'';height:24px;width:24px;left:4px;bottom:4px;background:#FFFDF8;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--primary);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .switch input:focus-visible + .slider{outline:2px solid var(--primary);outline-offset:2px;}
  .save-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 28px;background:linear-gradient(to top,var(--bg) 78%,rgba(247,245,239,0));}
  .save-btn{width:100%;height:52px;border-radius:26px;border:none;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s;}
  .save-btn:hover{background:#356A42;}
  .save-btn:active{transform:scale(.99);}
  .hint{font-size:13px;color:var(--on-surface-variant);margin-top:2px;line-height:1.5;}
</style>
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body>
<div class="phone" data-od-id="add-plant-screen">
  <div class="status"><span>16:00</span><span>5G · 82%</span></div>
  <header class="topbar">
    <a class="back" href="plants.html" aria-label="Назад" data-od-id="back-btn"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></a>
    <h1 data-od-id="add-title">Добавление растения</h1>
  </header>
  <main class="content">
    <div class="field">
      <label for="name">Название</label>
      <input type="text" id="name" placeholder="Например, Монстера" data-od-id="input-name" autocomplete="off">
    </div>
    <div class="field search-wrap">
      <label for="species">Вид (поиск)</label>
      <input type="text" id="species" placeholder="Начните вводить вид" autocomplete="off" data-od-id="input-species">
      <div class="suggest" id="suggest" data-od-id="species-suggest"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="freq">Частота полива</label>
        <select id="freq" data-od-id="input-freq">
          <option>Раз в 5 дней</option>
          <option selected>Раз в 7 дней</option>
          <option>Раз в 10 дней</option>
          <option>Раз в 14 дней</option>
        </select>
      </div>
      <div class="field">
        <label for="loc">Расположение</label>
        <select id="loc" data-od-id="input-location">
          <option>Гостиная</option>
          <option>Спальня</option>
          <option>Кухня</option>
          <option>Балкон</option>
        </select>
      </div>
    </div>
    <div class="toggle-row">
      <div>
        <div class="text">Напоминание</div>
        <div class="sub">Уведомлять о поливе в 09:00</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="remind" checked data-od-id="toggle-reminder">
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">Растение появится в коллекции после сохранения. Демо-дата: 16 ноября 2026.</div>
  </main>
  <div class="save-bar">
    <button class="save-btn" id="saveBtn" data-od-id="save-plant">Сохранить растение</button>
  </div>
</div>
<script>
  const speciesList=['Monstera deliciosa (Монстера)','Ficus elastica (Фикус)','Zamioculcas zamiifolia (Замиокулькас)','Sansevieria trifasciata (Сансевиерия)','Phalaenopsis (Орхидея)','Spathiphyllum (Спатифиллум)','Chlorophytum (Хлорофитум)'];
  const input=document.getElementById('species');
  const suggest=document.getElementById('suggest');
  input.addEventListener('input',()=>{
    const q=input.value.trim().toLowerCase();
    if(!q){suggest.classList.remove('show');suggest.innerHTML='';return;}
    const matches=speciesList.filter(s=>s.toLowerCase().includes(q));
    if(!matches.length){suggest.classList.remove('show');suggest.innerHTML='';return;}
    suggest.innerHTML=matches.map(m=>`<button type="button">${m}</button>`).join('');
    suggest.classList.add('show');
    suggest.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent;suggest.classList.remove('show');}));
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggest.classList.remove('show');});
  document.getElementById('saveBtn').addEventListener('click',()=>{window.location.href='plants.html';});
</script>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
