<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leafy — Карточка растения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#3F7D4E;--on-primary:#FFFFFF;--primary-container:#D7E8D8;--on-primary-container:#1F4F2C;
    --secondary-container:#E6E9DE;--on-secondary-container:#3F4A3A;
    --bg:#F7F5EF;--surface:#FFFDF8;--surface-container:#F1EEE6;--surface-container-high:#EBE7DD;
    --on-surface:#1D211C;--on-surface-variant:#5E665C;--outline:#C8CFC2;--outline-variant:#DDE3D7;
    --r-md:20px;--r-lg:24px;--r-xl:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;}
  body{background:#DCDAD2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--on-surface);}
  .phone{width:412px;height:915px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(29,33,28,.22);display:flex;flex-direction:column;}
  .status{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:500;color:var(--on-surface-variant);}
  .hero{height:272px;flex-shrink:0;background:linear-gradient(165deg,#E9F2E6,#CBDFc9);position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
  .hero svg{width:190px;height:190px;display:block;margin-bottom:-6px;}
  .back{position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:22px;background:rgba(255,253,248,.9);color:var(--on-surface);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 8px rgba(29,33,28,.12);}
  .back:hover{background:#FFFDF8;}
  .chip{position:absolute;top:14px;right:14px;height:36px;padding:0 14px;border-radius:18px;background:rgba(255,253,248,.9);color:var(--on-primary-container);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(29,33,28,.10);}
  .chip::before{content:'';width:7px;height:7px;border-radius:4px;background:var(--primary);}
  .content{flex:1;overflow-y:auto;padding:20px 20px 112px;}
  .content::-webkit-scrollbar{width:0;}
  h1{font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.015em;}
  .species{color:var(--on-surface-variant);font-size:16px;margin-top:4px;margin-bottom:20px;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
  .info{background:var(--surface-container);border-radius:var(--r-md);padding:14px 8px;text-align:center;}
  .info .label{font-size:11px;color:var(--on-surface-variant);margin-bottom:6px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;}
  .info .val{font-size:14px;font-weight:500;line-height:1.35;}
  .water-btn{width:100%;height:52px;border-radius:26px;border:none;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:500;cursor:pointer;margin-bottom:20px;transition:background .15s,transform .1s;}
  .water-btn:hover{background:#356A42;}
  .water-btn:active{transform:scale(.99);}
  .water-btn.done{background:var(--secondary-container);color:var(--on-secondary-container);cursor:default;}
  .history{background:var(--surface-container);border-radius:var(--r-lg);padding:18px;}
  .history h2{font-size:17px;font-weight:500;margin-bottom:6px;letter-spacing:-.01em;}
  .history .sub{font-size:13px;color:var(--on-surface-variant);margin-bottom:8px;}
  .hist-item{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--outline-variant);font-size:15px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-item span{color:var(--on-surface-variant);font-size:13px;white-space:nowrap;}
  .hist-item.fresh{color:var(--on-primary-container);font-weight:500;}
  .nav{height:80px;flex-shrink:0;background:var(--surface-container);display:flex;align-items:flex-start;justify-content:space-around;padding:12px 8px 0;}
  .nav a{flex:1;min-height:48px;text-decoration:none;color:var(--on-surface-variant);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;padding-top:2px;}
  .nav .icon-wrap{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .nav a.active{color:var(--on-primary-container);}
  .nav a.active .icon-wrap{background:var(--primary-container);}
  .nav svg{width:24px;height:24px;fill:currentColor;}
</style>
</head>
<body>
<div class="phone" data-od-id="detail-screen">
  <div class="status"><span>16:00</span><span>5G · 82%</span></div>
  <div class="hero" data-od-id="plant-hero">
    <a class="back" href="plants.html" aria-label="Назад" data-od-id="back-btn"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></a>
    <div class="chip" id="heroChip">Полить сегодня</div>
    <span id="heroArt"></span>
  </div>
  <main class="content">
    <h1 id="plantName" data-od-id="plant-name">Монстера</h1>
    <div class="species" id="plantSpecies" data-od-id="plant-species">Monstera deliciosa</div>
    <div class="info-grid" data-od-id="plant-info">
      <div class="info"><div class="label">Полив</div><div class="val" id="waterInfo">1 раз в 7 дней</div></div>
      <div class="info"><div class="label">Свет</div><div class="val" id="lightInfo">Рассеянный</div></div>
      <div class="info"><div class="label">Влажность</div><div class="val" id="humInfo">Средняя</div></div>
    </div>
    <button class="water-btn" id="waterBtn" data-od-id="mark-watered">Отметить полив</button>
    <section class="history" data-od-id="care-history">
      <h2>История ухода</h2>
      <div class="sub">Демо-дата: 16 ноября 2026</div>
      <div id="historyList"></div>
    </section>
  </main>
  <nav class="nav" data-od-id="bottom-nav">
    <a href="plants.html" class="active" data-od-id="nav-plants"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22a7 7 0 007-7c0-4-3-6.5-7-11-4 4.5-7 7-7 11a7 7 0 007 7z"/></svg></span>Растения</a>
    <a href="calendar.html" data-od-id="nav-calendar"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z"/></svg></span>Календарь</a>
    <a href="paywall.html" data-od-id="nav-plus"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 16.5 5.8 21l2.4-7.3L2 9.2h7.6z"/></svg></span>Plus</a>
  </nav>
</div>
<script>
  const ART={
    monstera:'<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="#3F7D4E"><path d="M60 62C48 50 40 36 44 24 56 30 62 44 62 60Z"/><path d="M60 62C72 50 80 36 76 24 64 30 58 44 58 60Z"/><path d="M58 66C44 66 32 74 28 88 42 88 54 80 58 68Z"/><path d="M62 66C76 66 88 74 92 88 78 88 66 80 62 68Z"/><path d="M60 62C56 76 56 88 60 102 64 88 64 76 60 62Z"/></g><g stroke="#D7E8D8" stroke-width="1.6" stroke-linecap="round" opacity=".9"><path d="M60 62 46 32"/><path d="M60 62 74 32"/><path d="M59 68 36 82"/><path d="M61 68 84 82"/></g><path d="M60 100C60 106 59 111 57 116" stroke="#2F5C3A" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
    ficus:'<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 116C60 92 60 60 60 26" stroke="#2F5C3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><g fill="#3F7D4E"><ellipse cx="44" cy="42" rx="16" ry="9" transform="rotate(-32 44 42)"/><ellipse cx="42" cy="70" rx="15" ry="8.5" transform="rotate(-26 42 70)"/></g><g fill="#356A42"><ellipse cx="76" cy="54" rx="16" ry="9" transform="rotate(28 76 54)"/><ellipse cx="78" cy="82" rx="15" ry="8.5" transform="rotate(24 78 82)"/></g><ellipse cx="60" cy="22" rx="14" ry="9" fill="#4A8A5A"/><g stroke="#D7E8D8" stroke-width="1.3" stroke-linecap="round" opacity=".85"><path d="M60 112 60 30"/><path d="M60 60 46 38"/><path d="M60 74 74 56"/></g></svg>',
    zamioculcas:'<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 116C60 92 60 58 60 24" stroke="#2F5C3A" stroke-width="2.4" fill="none" stroke-linecap="round"/><g fill="#3F7D4E"><ellipse cx="47" cy="34" rx="11" ry="5" transform="rotate(-38 47 34)"/><ellipse cx="47" cy="52" rx="11" ry="5" transform="rotate(-38 47 52)"/><ellipse cx="47" cy="70" rx="11" ry="5" transform="rotate(-38 47 70)"/><ellipse cx="47" cy="88" rx="10" ry="4.6" transform="rotate(-38 47 88)"/></g><g fill="#356A42"><ellipse cx="73" cy="34" rx="11" ry="5" transform="rotate(38 73 34)"/><ellipse cx="73" cy="52" rx="11" ry="5" transform="rotate(38 73 52)"/><ellipse cx="73" cy="70" rx="11" ry="5" transform="rotate(38 73 70)"/><ellipse cx="73" cy="88" rx="10" ry="4.6" transform="rotate(38 73 88)"/></g><ellipse cx="60" cy="20" rx="5" ry="10" fill="#4A8A5A"/></svg>',
    sansevieria:'<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="#3F7D4E"><path d="M60 112C57 84 56 54 60 22 64 54 63 84 60 112Z"/><path d="M46 112C42 88 40 62 44 36 50 64 50 90 48 112Z"/><path d="M74 112C78 88 80 62 76 36 70 64 70 90 72 112Z"/></g><g fill="#356A42"><path d="M34 112C32 94 32 76 35 58 39 78 39 96 37 112Z"/><path d="M86 112C88 94 88 76 85 58 81 78 81 96 83 112Z"/></g><g stroke="#D7E8D8" stroke-width="1.4" opacity=".8"><path d="M60 30 60 104"/><path d="M46 44 46 104"/><path d="M74 44 74 104"/></g></svg>',
    orchid:'<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M34 116C24 96 24 76 32 60 40 78 42 98 42 116Z" fill="#356A42"/><path d="M86 116C96 96 96 76 88 60 80 78 78 98 78 116Z" fill="#3F7D4E"/><path d="M32 116C50 92 72 68 94 40" stroke="#2F5C3A" stroke-width="2.4" fill="none" stroke-linecap="round"/><g fill="#E7D3DE"><ellipse cx="94" cy="36" rx="8" ry="6.5"/><ellipse cx="86" cy="44" rx="8" ry="6.5"/><ellipse cx="99" cy="45" rx="8" ry="6.5"/><ellipse cx="92" cy="48" rx="7" ry="5.5"/><ellipse cx="94" cy="42" rx="3.4" ry="3" fill="#B98BA6"/></g><g fill="#E7D3DE"><ellipse cx="76" cy="62" rx="7" ry="5.6"/><ellipse cx="69" cy="69" rx="7" ry="5.6"/><ellipse cx="80" cy="70" rx="7" ry="5.6"/><ellipse cx="75" cy="73" rx="6" ry="4.6"/><ellipse cx="76" cy="68" rx="2.8" ry="2.5" fill="#B98BA6"/></g><g fill="#E7D3DE"><ellipse cx="60" cy="82" rx="6" ry="4.8"/><ellipse cx="54" cy="88" rx="6" ry="4.8"/><ellipse cx="64" cy="89" rx="6" ry="4.8"/><ellipse cx="59" cy="92" rx="5" ry="4"/><ellipse cx="60" cy="87" rx="2.4" ry="2.2" fill="#B98BA6"/></g></svg>'
  };
  const PLANTS={
    monstera:{name:'Монстера',species:'Monstera deliciosa',water:'1 раз в 7 дней',light:'Рассеянный',hum:'Средняя',status:'today',statusText:'Полить сегодня',history:[['16.11.2026','Осмотр и опрыскивание'],['18.11.2026','Плановый полив'],['23.11.2026','Пересадка в больший горшок']]},
    ficus:{name:'Фикус',species:'Ficus elastica',water:'1 раз в 10 дней',light:'Яркий рассеянный',hum:'Умеренная',status:'later',statusText:'Через 3 дня',history:[['16.11.2026','Протирка листьев'],['19.11.2026','Плановый полив'],['22.11.2026','Осмотр']]},
    zamioculcas:{name:'Замиокулькас',species:'Zamioculcas zamiifolia',water:'1 раз в 14 дней',light:'Полутень',hum:'Низкая',status:'later',statusText:'Через 5 дней',history:[['16.11.2026','Осмотр'],['21.11.2026','Плановый полив'],['25.11.2026','Проверка почвы']]},
    sansevieria:{name:'Сансевиерия',species:'Sansevieria trifasciata',water:'1 раз в 12 дней',light:'Рассеянный',hum:'Низкая',status:'today',statusText:'Полить сегодня',history:[['16.11.2026','Полив'],['20.11.2026','Осмотр'],['28.11.2026','Плановый полив']]},
    orchid:{name:'Орхидея',species:'Phalaenopsis',water:'1 раз в 6 дней',light:'Яркий рассеянный',hum:'Высокая',status:'later',statusText:'Через 2 дня',history:[['16.11.2026','Осмотр корней'],['18.11.2026','Плановый полив'],['20.11.2026','Подкормка']]}
  };
  const key=new URLSearchParams(location.search).get('plant')||'monstera';
  const p=PLANTS[key]||PLANTS.monstera;
  document.getElementById('heroArt').innerHTML=ART[key]||ART.monstera;
  document.getElementById('plantName').textContent=p.name;
  document.getElementById('plantSpecies').textContent=p.species;
  document.getElementById('waterInfo').textContent=p.water;
  document.getElementById('lightInfo').textContent=p.light;
  document.getElementById('humInfo').textContent=p.hum;
  document.getElementById('heroChip').textContent=p.statusText;
  const list=document.getElementById('historyList');
  list.innerHTML=p.history.map(h=>`<div class="hist-item"><div>${h[1]}</div><span>${h[0]}</span></div>`).join('');
  const btn=document.getElementById('waterBtn');
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('done'))return;
    btn.classList.add('done');
    btn.textContent='Полив отмечен · 16.11.2026';
    const row=document.createElement('div');
    row.className='hist-item fresh';
    row.innerHTML='<div>Полив</div><span>16.11.2026</span>';
    list.prepend(row);
  });
</script>
</body>
</html>
