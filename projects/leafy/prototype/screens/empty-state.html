<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leafy — Пустое состояние</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#3F7D4E;--on-primary:#FFFFFF;--primary-container:#D7E8D8;--on-primary-container:#1F4F2C;
    --bg:#F7F5EF;--surface:#FFFDF8;--surface-container:#F1EEE6;--surface-container-high:#EBE7DD;
    --on-surface:#1D211C;--on-surface-variant:#5E665C;--outline:#C8CFC2;--outline-variant:#DDE3D7;
    --r-md:20px;--r-lg:24px;--r-xl:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;}
  body{background:#DCDAD2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--on-surface);}
  .phone{width:412px;height:915px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(29,33,28,.22);display:flex;flex-direction:column;}
  .status{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:500;color:var(--on-surface-variant);}
  .topbar{padding:10px 20px 12px;flex-shrink:0;}
  .topbar h1{font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.015em;}
  .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px 112px;}
  .illus{width:180px;height:180px;border-radius:90px;background:linear-gradient(160deg,#E7F0E4,#D5E4D2);display:flex;align-items:center;justify-content:center;margin-bottom:24px;color:var(--primary);}
  .illus svg{width:112px;height:112px;}
  h2{font-size:22px;font-weight:500;margin-bottom:8px;letter-spacing:-.01em;}
  p{font-size:16px;line-height:1.6;color:var(--on-surface-variant);margin-bottom:24px;max-width:30ch;}
  .btn{height:52px;border-radius:26px;border:none;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;padding:0 26px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;}
  .btn:hover{background:#356A42;}
  .btn:active{transform:scale(.99);}
  .nav{height:80px;flex-shrink:0;background:var(--surface-container);display:flex;align-items:flex-start;justify-content:space-around;padding:12px 8px 0;}
  .nav a{flex:1;min-height:48px;text-decoration:none;color:var(--on-surface-variant);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;padding-top:2px;}
  .nav .icon-wrap{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .nav a.active{color:var(--on-primary-container);}
  .nav a.active .icon-wrap{background:var(--primary-container);}
  .nav svg{width:24px;height:24px;fill:currentColor;}
</style>
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body>
<div class="phone" data-od-id="empty-screen">
  <div class="status"><span>16:00</span><span>5G · 82%</span></div>
  <header class="topbar"><h1>Мои растения</h1></header>
  <main class="content" data-od-id="empty-state">
    <div class="illus" data-od-id="empty-illustration"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 96C48 88 42 74 46 60 56 66 62 78 62 92Z" fill="#3F7D4E"/><path d="M62 96C74 88 80 74 76 60 66 66 60 78 60 92Z" fill="#356A42"/><path d="M61 92C61 78 60 64 60 52" stroke="#2F5C3A" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M60 52C54 44 46 40 38 40 44 48 52 52 60 52Z" fill="#4A8A5A"/><path d="M60 52C66 44 74 40 82 40 76 48 68 52 60 52Z" fill="#3F7D4E"/><path d="M40 96H80" stroke="#2F5C3A" stroke-width="2.6" stroke-linecap="round"/><path d="M46 96C46 104 52 110 60 110 68 110 74 104 74 96" stroke="#2F5C3A" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></div>
    <h2>Растений пока нет</h2>
    <p>Добавьте первое растение, чтобы получать напоминания о поливе и вести историю ухода.</p>
    <a class="btn" href="add-plant.html" data-od-id="empty-add-btn">Добавить растение</a>
  </main>
  <nav class="nav" data-od-id="bottom-nav">
    <a href="plants.html" class="active" data-od-id="nav-plants"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22a7 7 0 007-7c0-4-3-6.5-7-11-4 4.5-7 7-7 11a7 7 0 007 7z"/></svg></span>Растения</a>
    <a href="calendar.html" data-od-id="nav-calendar"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z"/></svg></span>Календар</a>
    <a href="paywall.html" data-od-id="nav-plus"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 16.5 5.8 21l2.4-7.3L2 9.2h7.6z"/></svg></span>Plus</a>
  </nav>
</div>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
