<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leafy — Календарь полива</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#3F7D4E;--on-primary:#FFFFFF;--primary-container:#D7E8D8;--on-primary-container:#1F4F2C;
    --secondary-container:#E6E9DE;--on-secondary-container:#3F4A3A;--tertiary:#8C5A2B;
    --bg:#F7F5EF;--surface:#FFFDF8;--surface-container:#F1EEE6;--surface-container-high:#EBE7DD;
    --on-surface:#1D211C;--on-surface-variant:#5E665C;--other-day:#6B7466;--outline:#C8CFC2;--outline-variant:#DDE3D7;
    --r-md:20px;--r-lg:24px;--r-xl:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;}
  body{background:#DCDAD2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--on-surface);}
  .phone{width:412px;height:915px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(29,33,28,.22);display:flex;flex-direction:column;}
  .status{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:500;color:var(--on-surface-variant);}
  .topbar{padding:10px 20px 12px;flex-shrink:0;}
  .topbar h1{font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.015em;}
  .content{flex:1;overflow-y:auto;padding:0 16px 112px;}
  .content::-webkit-scrollbar{width:0;}
  .card{background:var(--surface-container);border-radius:var(--r-lg);padding:18px 16px;margin-bottom:14px;}
  .month-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .month-row h2{font-size:18px;font-weight:500;letter-spacing:-.01em;}
  .month-row .muted{color:var(--on-surface-variant);font-size:13px;}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
  .weekdays div{font-size:11px;font-weight:500;color:var(--on-surface-variant);padding:6px 0;letter-spacing:.04em;text-transform:uppercase;}
  .day{height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;font-size:14px;cursor:pointer;position:relative;border:none;background:transparent;color:var(--on-surface);font-family:inherit;}
  .day:hover{background:rgba(63,125,78,.08);}
  .day:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
  .day.other{color:var(--other-day);opacity:.55;cursor:default;}
  .day.other:hover{background:transparent;}
  .day.selected{background:var(--primary);color:var(--on-primary);font-weight:500;}
  .day.marked::after{content:'';width:5px;height:5px;border-radius:3px;background:var(--tertiary);position:absolute;bottom:7px;left:50%;transform:translateX(-50%);}
  .day.selected.marked::after{background:#FFFFFF;}
  .tasks{background:var(--surface-container);border-radius:var(--r-lg);padding:18px 16px;}
  .tasks h3{font-size:17px;font-weight:500;margin-bottom:2px;letter-spacing:-.01em;}
  .tasks .sub{font-size:13px;color:var(--on-surface-variant);margin-bottom:6px;}
  .task{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 4px;border-bottom:1px solid var(--outline-variant);cursor:pointer;}
  .task:last-child{border-bottom:none;}
  .task input{width:24px;height:24px;flex-shrink:0;accent-color:var(--primary);cursor:pointer;}
  .task label{flex:1;font-size:16px;cursor:pointer;line-height:1.35;}
  .task.done label{color:var(--on-surface-variant);text-decoration:line-through;}
  .task .time{font-size:13px;color:var(--on-surface-variant);white-space:nowrap;}
  .empty-day{color:var(--on-surface-variant);font-size:15px;padding:10px 4px;}
  .nav{height:80px;flex-shrink:0;background:var(--surface-container);display:flex;align-items:flex-start;justify-content:space-around;padding:12px 8px 0;}
  .nav a{flex:1;min-height:48px;text-decoration:none;color:var(--on-surface-variant);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;padding-top:2px;}
  .nav .icon-wrap{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .nav a.active{color:var(--on-primary-container);}
  .nav a.active .icon-wrap{background:var(--primary-container);}
  .nav svg{width:24px;height:24px;fill:currentColor;}
  .fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:18px;background:var(--primary-container);color:var(--on-primary-container);border:none;box-shadow:0 6px 16px rgba(29,33,28,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .fab:hover{background:#C9DFC9;}
  .fab:active{transform:scale(.96);}
  .fab svg{width:24px;height:24px;fill:currentColor;}
</style>
</head>
<body>
<div class="phone" data-od-id="calendar-screen">
  <div class="status"><span>16:00</span><span>5G · 82%</span></div>
  <header class="topbar"><h1 data-od-id="calendar-title">Календарь полива</h1></header>
  <main class="content">
    <section class="card" data-od-id="month-card">
      <div class="month-row"><h2>Ноябрь 2026</h2><span class="muted">сегодня 16 ноября</span></div>
      <div class="weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
      <div class="days" id="days"></div>
    </section>
    <section class="tasks" data-od-id="day-tasks">
      <h3 id="tasksTitle">Задачи на 16 ноября</h3>
      <div class="sub" id="tasksSub">2 задачи · демо-дата 16.11.2026</div>
      <div id="taskList"></div>
    </section>
  </main>
  <a class="fab" href="add-plant.html" data-od-id="fab-add" aria-label="Добавить растение"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></a>
  <nav class="nav" data-od-id="bottom-nav">
    <a href="plants.html" data-od-id="nav-plants"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22a7 7 0 007-7c0-4-3-6.5-7-11-4 4.5-7 7-7 11a7 7 0 007 7z"/></svg></span>Растения</a>
    <a href="calendar.html" class="active" data-od-id="nav-calendar"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z"/></svg></span>Календарь</a>
    <a href="paywall.html" data-od-id="nav-plus"><span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 16.5 5.8 21l2.4-7.3L2 9.2h7.6z"/></svg></span>Plus</a>
  </nav>
</div>
<script>
  const marked={16:1,18:1,19:1,21:1,23:1,28:1};
  const tasksByDay={
    16:[{id:'t1',text:'Полить монстеру',time:'09:00',done:false},{id:'t2',text:'Полить сансевиерию',time:'09:30',done:false}],
    18:[{id:'t3',text:'Полить орхидею',time:'10:00',done:false}],
    19:[{id:'t4',text:'Полить фикус',time:'09:00',done:false}],
    21:[{id:'t5',text:'Проверить замиокулькас',time:'18:00',done:false}],
    23:[{id:'t6',text:'Полить монстеру',time:'09:00',done:false}],
    28:[{id:'t7',text:'Полить сансевиерию',time:'09:30',done:false}]
  };
  let selected=16;
  const daysEl=document.getElementById('days');
  const taskList=document.getElementById('taskList');
  const tasksTitle=document.getElementById('tasksTitle');
  const tasksSub=document.getElementById('tasksSub');
  function renderDays(){
    daysEl.innerHTML='';
    [26,27,28,29,30,31].forEach(d=>{const b=document.createElement('button');b.className='day other';b.textContent=d;b.tabIndex=-1;b.setAttribute('aria-hidden','true');daysEl.appendChild(b);});
    for(let d=1;d<=30;d++){
      const b=document.createElement('button');
      b.className='day'+(d===selected?' selected':'')+(marked[d]?' marked':'');
      b.textContent=d;
      b.setAttribute('aria-label',d+' ноября 2026'+(marked[d]?' — есть задачи':''));
      b.addEventListener('click',()=>{selected=d;renderDays();renderTasks();});
      daysEl.appendChild(b);
    }
    [1,2,3,4,5,6].forEach(d=>{const b=document.createElement('button');b.className='day other';b.textContent=d;b.tabIndex=-1;b.setAttribute('aria-hidden','true');daysEl.appendChild(b);});
  }
  function renderTasks(){
    tasksTitle.textContent='Задачи на '+selected+' ноября';
    const items=tasksByDay[selected]||[];
    tasksSub.textContent=items.length?items.length+(items.length===1?' задача':' задачи')+' · демо-дата 16.11.2026':'демо-дата 16.11.2026';
    if(!items.length){taskList.innerHTML='<div class="empty-day">На этот день задач нет</div>';return;}
    taskList.innerHTML=items.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" id="${t.id}" ${t.done?'checked':''} aria-label="${t.text}"><label for="${t.id}">${t.text}</label><span class="time">${t.time}</span></div>`).join('');
    taskList.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const item=items.find(x=>x.id===cb.id);if(item)item.done=cb.checked;
        cb.closest('.task').classList.toggle('done',cb.checked);
      });
    });
  }
  renderDays();renderTasks();
</script>
</body>
</html>
