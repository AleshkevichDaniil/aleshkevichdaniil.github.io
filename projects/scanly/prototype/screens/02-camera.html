<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scanly — Сканирование</title>
  <link rel="stylesheet" href="../assets/app.css" />
  <link rel="stylesheet" href="../assets/screen-camera.css" />
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body class="screen">

  <header class="statusbar" data-od-id="statusbar">
    <span>9:41</span>
    <span class="status-right">
      <svg viewBox="0 0 17 11" aria-hidden="true">
        <rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/>
        <rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/>
      </svg>
      <svg viewBox="0 0 17 11" aria-hidden="true">
        <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
      </svg>
      <svg class="battery" viewBox="0 0 25 11" aria-hidden="true">
        <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
        <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.4"/>
        <rect x="2" y="2" width="18" height="7" rx="1.4"/>
      </svg>
    </span>
  </header>

  <header class="appbar" data-od-id="camera-header">
    <a class="icon-btn icon-btn--plain" href="04-documents.html" aria-label="Закрыть сканирование">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18"/>
      </svg>
    </a>
    <div class="appbar-title">
      <h1>Сканирование</h1>
    </div>
    <button class="icon-btn icon-btn--plain" type="button" id="flash" aria-pressed="false" aria-label="Вспышка">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z"/>
      </svg>
    </button>
  </header>

  <main class="content camera-content" data-od-id="camera-content">

    <section class="viewfinder" data-od-id="camera-viewfinder" aria-label="Видоискатель камеры">
      <span class="cam-chip cam-chip--detect"><span class="cam-dot" aria-hidden="true"></span>Документ в кадре</span>
      <span class="cam-chip cam-chip--page">Стр. 1</span>

      <div class="scan-frame">
        <div class="scan-doc">
          <div class="scan-paper" aria-hidden="true">
            <p class="paper-kicker">ДОГОВОР</p>
            <p class="paper-heading">Аренды жилого<br />помещения</p>
            <p class="paper-date">г. Москва · 22 ноября 2026</p>
            <span class="paper-line w-100"></span>
            <span class="paper-line w-90"></span>
            <span class="paper-gap"></span>
            <span class="paper-line w-96"></span>
            <span class="paper-line w-84"></span>
            <span class="paper-line w-100"></span>
            <span class="paper-line w-70"></span>
            <span class="paper-gap"></span>
            <span class="paper-line w-90"></span>
            <span class="paper-line w-96"></span>
            <span class="paper-line w-54"></span>
            <span class="paper-line w-84"></span>
            <span class="paper-line w-100"></span>
            <span class="paper-line w-70"></span>
            <span class="paper-line w-90"></span>
            <div class="paper-signs">
              <div><span></span><em>Арендодатель</em></div>
              <div><span></span><em>Арендатор</em></div>
            </div>
          </div>
          <span class="scan-corners" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </div>
      </div>
    </section>

    <p class="cam-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.6"/>
      </svg>
      Держите телефон параллельно листу
    </p>

  </main>

  <footer class="dock capture-dock" data-od-id="camera-controls">
    <div class="capture-bar">
      <a class="thumb-btn" href="04-documents.html" aria-label="Открыть последний скан">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <path d="m3 15 4.5-4.5 3.5 3.5 3-3L21 17"/>
          <circle cx="8.5" cy="9" r="1.3"/>
        </svg>
      </a>

      <button class="shutter" type="button" aria-label="Снять страницу" onclick="location.href='03-crop.html'">
        <span class="shutter-core" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8.5V6a2 2 0 0 1 2-2h2.5"/><path d="M15.5 4H18a2 2 0 0 1 2 2v2.5"/>
            <path d="M20 15.5V18a2 2 0 0 1-2 2h-2.5"/><path d="M8.5 20H6a2 2 0 0 1-2-2v-2.5"/>
          </svg>
        </span>
      </button>

      <button class="auto-toggle" type="button" id="auto-crop" aria-pressed="true">
        <span class="auto-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3v4H2M18 3v4h4M6 21v-4H2M18 21v-4h4"/>
            <rect x="7.5" y="7.5" width="9" height="9" rx="1.4"/>
          </svg>
        </span>
        Авто
      </button>
    </div>
  </footer>

  <div class="homebar" aria-hidden="true"></div>

  <script>
    (function () {
      var flash = document.getElementById('flash');
      var auto = document.getElementById('auto-crop');
      function toggle(btn) {
        btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      }
      flash.addEventListener('click', function () { toggle(flash); });
      auto.addEventListener('click', function () { toggle(auto); });
    })();
    window.parent.postMessage({ screen: '02-camera.html' }, '*');
  </script>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
