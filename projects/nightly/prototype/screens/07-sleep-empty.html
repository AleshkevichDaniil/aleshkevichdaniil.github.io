<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly — Сон без данных</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { background: #07080e; }

  .sleep-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 8px;
  }

  .sleep-head .eyebrow {
    margin-bottom: 6px;
    color: var(--muted);
  }

  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border-radius: var(--r-pill);
    border: 1px solid var(--border-soft);
    background: rgba(255, 255, 255, 0.045);
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .date-chip .ico {
    width: 14px;
    height: 14px;
  }

  /* ---------- empty art ---------- */

  .empty-art {
    position: relative;
    height: 196px;
    display: grid;
    place-items: center;
    margin-bottom: 6px;
  }

  .dash-ring {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.14);
  }

  .dash-ring.r2 {
    width: 200px;
    height: 200px;
    border-color: rgba(255, 255, 255, 0.075);
  }

  .empty-orb {
    position: relative;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(120% 120% at 34% 20%, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.02) 62%),
      rgba(20, 24, 44, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 26px 60px -26px rgba(139, 140, 255, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.13);
  }

  .empty-orb .ico {
    width: 44px;
    height: 44px;
    stroke-width: 1.4;
    color: var(--fg);
    opacity: 0.9;
  }

  .empty-art::before {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 140, 255, 0.16), transparent 66%);
  }

  /* ---------- copy ---------- */

  .empty-copy {
    text-align: center;
    max-width: 320px;
    margin: 0 auto;
  }

  .empty-copy h2 {
    font-family: var(--font-display);
    font-size: 23px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .empty-copy p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* ---------- steps ---------- */

  .steps {
    margin: 18px 0 0;
    padding: 6px 16px;
    list-style: none;
    border-radius: var(--r-lg);
    border: 1px solid var(--border-hair);
    background: rgba(255, 255, 255, 0.035);
  }

  .steps li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    font-size: 13.5px;
    color: var(--muted);
  }

  .steps li + li {
    border-top: 1px solid var(--border-hair);
  }

  .step-num {
    width: 24px;
    height: 24px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(139, 140, 255, 0.14);
    border: 1px solid rgba(139, 140, 255, 0.26);
    color: var(--fg);
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .empty-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
  }
</style>
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body data-screen="sleep-empty">
  <div class="device" data-nav="sleep">
    <div class="scroll nav">
      <div class="pad">
        <header class="sleep-head">
          <div>
            <p class="eyebrow">Статистика</p>
            <h1 class="h1">Сон</h1>
          </div>
          <span class="date-chip">
            <svg class="ico" aria-hidden="true"><use href="#i-calendar"></use></svg>
            <span data-demo-date>16 нояб.</span>
          </span>
        </header>

        <div class="empty-art" aria-hidden="true">
          <span class="dash-ring"></span>
          <span class="dash-ring r2"></span>
          <div class="empty-orb">
            <svg class="ico"><use href="#i-moon"></use></svg>
          </div>
        </div>

        <div class="empty-copy">
          <h2 data-od-id="sleep-empty-title">Данных о сне пока нет</h2>
          <p>Проведите первую ночь с Nightly — утром здесь появятся часы сна, фазы и оценка.</p>
        </div>

        <ol class="steps">
          <li><span class="step-num" aria-hidden="true">1</span>Настройте будильник и окно пробуждения</li>
          <li><span class="step-num" aria-hidden="true">2</span>Включите звук перед сном</li>
          <li><span class="step-num" aria-hidden="true">3</span>Утром откройте статистику</li>
        </ol>

        <div class="empty-actions">
          <a class="btn btn-primary btn-block" href="04-alarm.html" data-od-id="sleep-empty-alarm">Настроить будильник</a>
          <a class="btn btn-ghost btn-block" href="02-home.html" data-od-id="sleep-empty-sounds">Выбрать звук</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/app.js"></script>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
