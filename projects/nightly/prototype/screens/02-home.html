<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly — Звуки</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { background: #07080e; }

  .home-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 16px;
  }

  .home-head .eyebrow {
    margin-bottom: 8px;
    color: var(--muted);
  }

  .home-title {
    font-size: 28px;
    margin-bottom: 6px;
  }

  .home-date {
    font-size: 12.5px;
    color: var(--muted-soft);
  }

  /* ---------- continue ---------- */

  .continue-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    min-height: 92px;
    border-radius: var(--r-lg);
    border: 1px solid var(--accent-line);
    background:
      radial-gradient(120% 160% at 0% 0%, rgba(139, 140, 255, 0.22), transparent 58%),
      linear-gradient(160deg, rgba(30, 35, 64, 0.9), rgba(20, 24, 44, 0.9));
    box-shadow: 0 24px 50px -30px rgba(139, 140, 255, 0.7);
    transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
  }

  .continue-card:hover {
    border-color: rgba(139, 140, 255, 0.6);
  }

  .continue-card:active {
    transform: scale(0.99);
  }

  .cc-icon {
    width: 46px;
    height: 46px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: rgba(139, 140, 255, 0.16);
    border: 1px solid rgba(139, 140, 255, 0.24);
  }

  .cc-icon .ico {
    width: 24px;
    height: 24px;
    color: var(--fg);
  }

  .cc-copy {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .cc-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(190, 195, 230, 0.85);
  }

  .cc-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .cc-meta {
    font-size: 12.5px;
    color: var(--muted);
  }

  .cc-play {
    width: 46px;
    height: 46px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: var(--glow-accent);
  }

  .cc-play .ico {
    width: 20px;
    height: 20px;
    margin-left: 2px;
  }

  /* ---------- section ---------- */

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 18px 0 12px;
  }

  .section-head .h2 {
    font-size: 19px;
  }

  /* ---------- sound grid ---------- */

  .sound-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .sound-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 110px;
    padding: 14px;
    border-radius: var(--r-lg);
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: linear-gradient(158deg, var(--tone-1), var(--tone-2));
    overflow: hidden;
    isolation: isolate;
    transition: transform 0.2s var(--ease), border-color 0.2s var(--ease),
      box-shadow 0.2s var(--ease);
  }

  .sound-card::after {
    content: "";
    position: absolute;
    inset: -50px -30% auto -12%;
    height: 150px;
    background: radial-gradient(62% 100% at 50% 0%, var(--tone-glow), transparent 72%);
    z-index: -1;
    opacity: 0.5;
  }

  .sound-card:hover {
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow: 0 18px 36px -22px rgba(0, 0, 0, 0.9);
  }

  .sound-card:active {
    transform: scale(0.985);
  }

  .sc-icon {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: rgba(8, 10, 22, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .sc-icon .ico {
    width: 19px;
    height: 19px;
    stroke-width: 1.65;
    color: rgba(255, 255, 255, 0.9);
  }

  .sc-lock {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(10, 12, 24, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(8px);
  }

  .sc-lock .ico {
    width: 13px;
    height: 13px;
    stroke-width: 1.8;
  }

  .sc-body {
    display: flex;
    flex-direction: column;
  }

  .sc-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: #fff;
    white-space: nowrap;
  }

  .sc-meta {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.75);
    white-space: nowrap;
  }

  /* ---------- plus promo ---------- */

  .plus-promo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--r-lg);
    border: 1px solid var(--border-soft);
    background: rgba(255, 255, 255, 0.035);
    transition: border-color 0.2s var(--ease), background-color 0.2s var(--ease);
  }

  .plus-promo:hover {
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
  }

  .pp-icon {
    width: 34px;
    height: 34px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-hair);
    color: var(--accent);
  }

  .pp-icon .ico {
    width: 18px;
    height: 18px;
  }

  .pp-copy {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .pp-title {
    font-size: 14.5px;
    font-weight: 600;
  }

  .pp-text {
    font-size: 12px;
    color: var(--muted);
  }

  .pp-arrow {
    width: 18px;
    height: 18px;
    color: var(--muted);
  }

  .plus-promo.is-plus {
    border-color: rgba(139, 140, 255, 0.18);
    background: rgba(255, 255, 255, 0.04);
  }

  .plus-promo.is-plus .pp-icon {
    color: var(--fg);
  }
</style>
</head>
<body data-screen="home">
  <div class="device" data-nav="sounds">
    <div class="scroll nav">
      <div class="pad">
        <header class="home-head">
          <div>
            <p class="eyebrow" data-greeting>Добрый вечер</p>
            <h1 class="h1 home-title" data-od-id="home-greeting">Пора замедлиться</h1>
            <p class="home-date"><span data-demo-weekday>понедельник</span>, <span data-demo-date>16 нояб.</span></p>
          </div>
        </header>

        <a class="continue-card" data-continue href="03-player.html?sound=rain" data-od-id="home-continue">
          <span class="cc-icon">
            <svg class="ico" aria-hidden="true"><use data-continue-icon href="#i-rain"></use></svg>
          </span>
          <span class="cc-copy">
            <span class="cc-eyebrow">Продолжить</span>
            <span class="cc-name" data-continue-name>Дождь</span>
            <span class="cc-meta" data-continue-meta>Таймер · 30 мин</span>
          </span>
          <span class="cc-play" aria-hidden="true">
            <svg class="ico"><use href="#i-play"></use></svg>
          </span>
          <span class="sr-only">Открыть плеер</span>
        </a>

        <div class="section-head">
          <h2 class="h2">Звуки</h2>
          <span class="tiny">6 звуков</span>
        </div>

        <div class="sound-grid" data-od-id="home-sound-grid">
          <a class="sound-card tone-rain" href="03-player.html?sound=rain" data-sound="rain" data-od-id="sound-card-rain">
            <span class="sc-icon"><svg class="ico" aria-hidden="true"><use href="#i-rain"></use></svg></span>
            <span class="sc-body">
              <span class="sc-name">Дождь</span>
              <span class="sc-meta">Природный шум</span>
            </span>
          </a>

          <a class="sound-card tone-ocean" href="03-player.html?sound=ocean" data-sound="ocean" data-od-id="sound-card-ocean">
            <span class="sc-icon"><svg class="ico" aria-hidden="true"><use href="#i-ocean"></use></svg></span>
            <span class="sc-body">
              <span class="sc-name">Океан</span>
              <span class="sc-meta">Глубокие волны</span>
            </span>
          </a>

          <a class="sound-card tone-forest" href="06-paywall.html" data-sound="forest" data-locked="true" data-od-id="sound-card-forest">
            <span class="sc-lock" data-lock aria-hidden="true"><svg class="ico"><use href="#i-lock"></use></svg></span>
            <span class="sc-icon"><svg class="ico" aria-hidden="true"><use href="#i-forest"></use></svg></span>
            <span class="sc-body">
              <span class="sc-name">Лес</span>
              <span class="sc-meta">Ночные цикады</span>
            </span>
          </a>

          <a class="sound-card tone-fire" href="06-paywall.html" data-sound="fire" data-locked="true" data-od-id="sound-card-fire">
            <span class="sc-lock" data-lock aria-hidden="true"><svg class="ico"><use href="#i-lock"></use></svg></span>
            <span class="sc-icon"><svg class="ico" aria-hidden="true"><use href="#i-fire"></use></svg></span>
            <span class="sc-body">
              <span class="sc-name">Камин</span>
              <span class="sc-meta">Тёплый треск</span>
            </span>
          </a>

          <a class="sound-card tone-fan" href="06-paywall.html" data-sound="fan" data-locked="true" data-od-id="sound-card-fan">
            <span class="sc-lock" data-lock aria-hidden="true"><svg class="ico"><use href="#i-lock"></use></svg></span>
            <span class="sc-icon"><svg class="ico" aria-hidden="true"><use href="#i-fan"></use></svg></span>
            <span class="sc-body">
              <span class="sc-name">Вентилятор</span>
              <span class="sc-meta">Ровный гул</span>
            </span>
          </a>

          <a class="sound-card tone-white" href="03-player.html?sound=white" data-sound="white" data-od-id="sound-card-white">
            <span class="sc-icon"><svg class="ico" aria-hidden="true"><use href="#i-noise"></use></svg></span>
            <span class="sc-body">
              <span class="sc-name">Белый шум</span>
              <span class="sc-meta">Широкий спектр</span>
            </span>
          </a>
        </div>

        <a class="plus-promo" id="plusPromo" href="06-paywall.html" data-od-id="home-plus-promo">
          <span class="pp-icon" aria-hidden="true"><svg class="ico"><use href="#i-spark"></use></svg></span>
          <span class="pp-copy">
            <span class="pp-title" data-promo-title>Nightly Plus</span>
            <span class="pp-text" data-promo-text>Все звуки, статистика и умный будильник</span>
          </span>
          <svg class="ico pp-arrow" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </a>
      </div>
    </div>
  </div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
