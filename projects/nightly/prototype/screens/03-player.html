<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly — Плеер</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  body { background: #07080e; }

  .player {
    display: flex;
    flex-direction: column;
    padding-top: 2px;
  }

  .player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .player-top .eyebrow {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(139, 140, 255, 0.8);
    transition: background-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  .live-dot.is-off {
    background: var(--muted-soft);
    box-shadow: none;
  }

  /* ---------- art ---------- */

  .player-art {
    position: relative;
    display: grid;
    place-items: center;
    height: 232px;
    margin: 4px 0 0;
  }

  .orb {
    position: relative;
    width: 214px;
    height: 214px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background-image: radial-gradient(58% 58% at 50% 34%, var(--tone-glow) 0%, transparent 68%);
  }

  .orb::before {
    content: "";
    position: absolute;
    width: 214px;
    height: 214px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.07);
  }

  .orb-halo {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--tone-glow), transparent 62%);
    opacity: 0.45;
    filter: blur(12px);
    transition: opacity 0.4s var(--ease);
  }

  .orb-disc {
    position: relative;
    width: 168px;
    height: 168px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, var(--tone-1), var(--tone-2));
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow:
      0 34px 60px -30px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  .orb-disc::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.4);
    opacity: 0;
  }

  .orb.is-playing .orb-disc::after {
    animation: halo 4.2s var(--ease) infinite;
  }

  .orb.is-playing .orb-halo {
    opacity: 0.7;
  }

  @keyframes halo {
    0% { transform: scale(1); opacity: 0.5; }
    70% { transform: scale(1.19); opacity: 0; }
    100% { transform: scale(1.19); opacity: 0; }
  }

  .orb-disc .ico {
    width: 60px;
    height: 60px;
    stroke-width: 1.35;
    color: #fff;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.45));
  }

  /* ---------- copy ---------- */

  .track-copy {
    text-align: center;
    margin-top: 2px;
  }

  .track-copy .eyebrow {
    color: var(--muted-soft);
    margin-bottom: 6px;
  }

  .track-copy .display {
    font-size: 33px;
  }

  .fade {
    align-self: center;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 12px 0 0;
    padding: 8px 14px;
    border-radius: var(--r-pill);
    border: 1px solid var(--border-soft);
    background: rgba(255, 255, 255, 0.05);
    color: var(--fg);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .fade .ico {
    width: 15px;
    height: 15px;
    color: var(--muted);
  }

  /* ---------- volume ---------- */

  .volume {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding: 4px 2px;
  }

  .volume > .ico {
    width: 20px;
    height: 20px;
    color: var(--muted);
  }

  .volume-val {
    width: 42px;
    text-align: right;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- timer ---------- */

  .timer-block {
    margin-top: 14px;
  }

  .timer-block .eyebrow {
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .timer-chips {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .timer-chips .chip {
    padding: 0;
    font-size: 13px;
    min-height: 44px;
  }

  /* ---------- controls ---------- */

  .controls {
    margin-top: auto;
    padding-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .play-btn {
    width: 84px;
    height: 84px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 22px 48px -16px rgba(139, 140, 255, 0.8);
    transition: transform 0.18s var(--ease), background-color 0.18s var(--ease),
      box-shadow 0.18s var(--ease);
  }

  .play-btn:hover {
    background: var(--accent-hi);
    box-shadow: 0 24px 52px -14px rgba(139, 140, 255, 0.9);
  }

  .play-btn:active {
    transform: scale(0.96);
  }

  .play-btn .ico {
    width: 30px;
    height: 30px;
  }

  .play-btn[aria-pressed="false"] .ico {
    margin-left: 4px;
  }

  .play-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted-soft);
  }
</style>
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body data-screen="player">
  <div class="device">
    <div class="scroll">
      <div class="pad player">
        <div class="player-top">
          <a class="icon-btn bare" href="02-home.html" aria-label="Назад к звукам" data-od-id="player-back">
            <svg class="ico"><use href="#i-chevron-left"></use></svg>
          </a>
          <p class="eyebrow"><span class="live-dot" id="liveDot" aria-hidden="true"></span>Сейчас играет</p>
          <span style="width: 44px" aria-hidden="true"></span>
        </div>

        <div class="player-art" id="playerArt">
          <div class="orb tone-rain is-playing" id="orb">
            <span class="orb-halo" aria-hidden="true"></span>
            <div class="orb-disc">
              <svg class="ico" aria-hidden="true"><use id="orbIcon" href="#i-rain"></use></svg>
            </div>
          </div>
        </div>

        <div class="track-copy">
          <p class="eyebrow" id="soundMeta">Природный шум</p>
          <h1 class="display" id="soundName">Дождь</h1>
        </div>

        <p class="fade" role="status" data-od-id="player-fade">
          <svg class="ico" aria-hidden="true"><use href="#i-timer"></use></svg>
          <span id="fadeText">Звук затихнет через 28 мин</span>
        </p>

        <div class="volume">
          <svg class="ico" aria-hidden="true"><use href="#i-volume"></use></svg>
          <input class="range" id="volume" data-od-id="player-volume" type="range" min="0" max="100" step="1" value="62" aria-label="Громкость">
          <span class="volume-val" id="volumeValue">62%</span>
        </div>

        <div class="timer-block">
          <p class="eyebrow" id="timerLabel">Таймер сна</p>
          <div class="timer-chips" role="group" aria-labelledby="timerLabel" data-od-id="player-timers">
            <button type="button" class="chip" data-timer="15">15 мин</button>
            <button type="button" class="chip" data-timer="30" aria-pressed="true">30 мин</button>
            <button type="button" class="chip" data-timer="60">60 мин</button>
            <button type="button" class="chip" data-timer="night">До утра</button>
          </div>
        </div>

        <div class="controls">
          <button type="button" class="play-btn" id="playToggle" aria-pressed="true" aria-label="Пауза" data-od-id="player-play-toggle">
            <svg class="ico" aria-hidden="true"><use id="playIcon" href="#i-pause"></use></svg>
          </button>
          <span class="play-label" id="playLabel">Пауза</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/app.js"></script>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
