<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Habitly — Карточка привычки</title>
  <link rel="stylesheet" href="../assets/habitly.css" />
<style data-prototype-transition>
@keyframes prototype-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}
body {
  animation: prototype-enter 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
html.prototype-leaving body {
  opacity: 0;
  transition: opacity 140ms ease;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  html.prototype-leaving body { transition: none; }
}
</style>
</head>
<body class="screen-page">
  <div class="screen" data-od-id="detail-screen" data-screen="detail">

    <header class="app-header compact" data-od-id="detail-header">
      <a class="icon-btn plain" href="02-today.html" aria-label="Вернуться к списку на сегодня">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
      </a>
      <h1 class="header-title">Привычка</h1>
      <span aria-hidden="true"></span>
    </header>

    <main class="app-body" data-od-id="detail-content">

      <section class="detail-head" data-od-id="detail-title">
        <span class="tile t-clay" data-detail="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" /></svg>
        </span>
        <div>
          <h2 data-detail="title">Утренняя растяжка</h2>
          <p data-detail="meta">10 минут · каждый день · 08:00</p>
        </div>
      </section>

      <section class="card" data-od-id="detail-streak">
        <div class="ring-block">
          <div class="ring">
            <svg viewBox="0 0 168 168" aria-hidden="true">
              <g transform="rotate(-90 84 84)" fill="none" stroke-linecap="round">
                <circle cx="84" cy="84" r="70" stroke="var(--accent-soft)" stroke-width="10" />
                <circle cx="84" cy="84" r="70" stroke="var(--accent)" stroke-width="10" data-detail="ring" />
              </g>
            </svg>
            <div class="ring-center">
              <span class="ring-number" data-detail="streak">28</span>
              <span class="ring-label">дней подряд</span>
            </div>
          </div>
          <p class="ring-note" data-detail="note"><strong>22 из 22</strong> дней в декабре</p>
        </div>
      </section>

      <section class="card" data-od-id="detail-week">
        <div class="card-title">
          <h2>Эта неделя</h2>
          <span class="mono">21–27 декабря</span>
        </div>
        <div class="week-strip">
          <span class="week-day">Пн<span class="week-dot on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg></span></span>
          <span class="week-day">Вт<span class="week-dot today on" data-detail-week="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg></span></span>
          <span class="week-day">Ср<span class="week-dot future"></span></span>
          <span class="week-day">Чт<span class="week-dot future"></span></span>
          <span class="week-day">Пт<span class="week-dot future"></span></span>
          <span class="week-day">Сб<span class="week-dot future"></span></span>
          <span class="week-day">Вс<span class="week-dot future"></span></span>
        </div>
      </section>

      <section class="card note-card" data-od-id="detail-note">
        <p class="mono">заметка</p>
        <p class="note-text" data-detail="memo">Тянусь под утренний подкаст: десяти минут хватает.</p>
      </section>

      <a class="link-row" href="05-stats.html" data-od-id="detail-stats-link">
        Статистика за месяц
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </a>

    </main>

    <footer class="app-footer" data-od-id="detail-footer">
      <button class="btn btn-done btn-block" type="button" data-detail-action data-done="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
        Выполнено сегодня
      </button>
    </footer>

  </div>
  <script src="../assets/habitly.js"></script>
<script data-prototype-transition>
(() => {
  if (window.__prototypeTransitions) return;
  window.__prototypeTransitions = true;

  document.addEventListener('click', (event) => {
    if (
      event.defaultPrevented ||
      event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey ||
      !(event.target instanceof Element)
    ) {
      return;
    }

    const link = event.target.closest('a[href]');
    if (
      !link ||
      (link.target && link.target !== '_self') ||
      link.hasAttribute('download')
    ) {
      return;
    }

    let url;
    try {
      url = new URL(link.href, location.href);
    } catch {
      return;
    }

    if (url.origin !== location.origin) return;
    if (url.hash && url.pathname === location.pathname) return;

    event.preventDefault();
    document.documentElement.classList.add('prototype-leaving');

    setTimeout(() => {
      location.href = url.href;
    }, 150);
  });
})();
</script>
</body>
</html>
